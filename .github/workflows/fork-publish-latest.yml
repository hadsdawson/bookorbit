# Fork-only: forks have CI turned off, so nothing builds the image after a merge. This builds it
# with the existing Container Image workflow and then points `latest` at the new build, so the NAS
# can stay on ghcr.io/<owner>/bookorbit:latest. Kept in its own file so upstream merges never
# conflict with it.
name: Fork - Build and Publish Latest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-publish-latest
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-and-tag:
    name: Build image and tag latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Start the Container Image build
        id: dispatch
        run: |
          set -euo pipefail
          started_after=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run container-image.yml --repo "$REPO" --ref main
          # The dispatch API returns no run id, so find the run it created.
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --repo "$REPO" --workflow container-image.yml --event workflow_dispatch \
              --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$SHA\" and .createdAt >= \"$started_after\")] | first | .databaseId // empty")
            if [ -n "$run_id" ]; then echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::error::Could not find the Container Image run that was just started."
          exit 1

      - name: Wait for the build to finish
        run: gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "$REPO" --exit-status --interval 30

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Point latest at this build
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create --tag "$image:latest" "$image:sha-${SHA:0:12}"
          docker buildx imagetools inspect "$image:latest"
