# Fork-only: points `latest` at the newest image of main, so the NAS can stay on
# ghcr.io/<owner>/bookorbit:latest. The Container Image workflow builds main only after the CI run
# for that push has passed, and this runs when that build finishes, so a push whose tests fail is
# never published. The image `latest` pointed at before is kept as `previous`, so going back is a
# one-word change on the NAS.
#
# To publish without waiting for CI (the tests are broken and a fix is urgent): run Container Image
# by hand from the Actions tab. This workflow follows it and tags the result.
# Kept in its own file so upstream merges never conflict with it.
name: Fork - Publish Latest

on:
  workflow_run:
    workflows: ["Container Image"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: fork-publish-latest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  tag-latest:
    name: Point latest at the newest build of main
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Point latest at the build of main's newest commit
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          # Always main's newest commit, whichever build finished: an older build finishing late
          # can then never move latest backwards.
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          new="$image:sha-${head:0:12}"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null || true; }
          new_digest=$(digest "$new")
          if [ -z "$new_digest" ]; then
            echo "::notice::No image for ${head:0:12} yet. It is tagged when its own build finishes, which needs its tests to pass first."
            exit 0
          fi
          old_digest=$(digest "$image:latest")
          if [ "$old_digest" = "$new_digest" ]; then
            echo "::notice::latest already points at ${head:0:12}."
            exit 0
          fi
          if [ -n "$old_digest" ]; then
            docker buildx imagetools create --tag "$image:previous" "$image:latest"
          fi
          docker buildx imagetools create --tag "$image:latest" "$new"
          docker buildx imagetools inspect "$image:latest"
          {
            echo "### Published \`$image:latest\`"
            echo "- This build: \`$new\`"
            echo "- To go back: use \`$image:previous\` on the NAS, or any earlier \`sha-\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
